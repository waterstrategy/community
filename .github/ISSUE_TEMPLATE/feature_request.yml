name: Feature request
description: Suggest an improvement or request a capability
title: "[Request]: "
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to be able to do?
      description: Explain the need or problem this request would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe your idea, if you have one.
    validations:
      required: false
