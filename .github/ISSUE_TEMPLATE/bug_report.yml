name: Problem report
description: Report a problem with Waterstrategy
title: "[Problem]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Add steps to reproduce or any other useful context.
    validations:
      required: false
